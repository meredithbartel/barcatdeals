# bardeals configuration
# Everything tunable lives here. No venue or pacing value is hardcoded in Python.

timezone: America/New_York

llm:
  model: claude-sonnet-4-5
  max_tokens: 2048

paths:
  db: data/bardeals.db
  images: data/images
  reports: data/reports
  log: data/bardeals.log
  fixtures: tests/fixtures
  pages: data/pages          # cached website HTML, for debugging extractions

scrape:
  # Posts pulled per account per run.
  posts_per_account: 10
  # Random sleep (seconds) between accounts.
  sleep_between_accounts: [8, 15]
  # Random sleep (seconds) between individual posts.
  sleep_between_posts: [2, 5]
  # Hard ceiling on Instagram requests per rolling hour.
  max_requests_per_hour: 150
  # Retries per account before giving up on it and moving on.
  max_retries_per_account: 3
  # Exponential backoff base (seconds): base * 2**attempt, plus jitter.
  backoff_base_seconds: 30
  # Save every successful live fetch into tests/fixtures/ for offline dev.
  save_fixtures: true

web:
  # Website scraping. Unlike Instagram these are ordinary public pages that
  # welcome visitors, so the pacing here is politeness rather than evasion.
  enabled: true
  # Obey robots.txt. Leave this on.
  respect_robots: true
  # Seconds to wait between requests to the SAME site.
  delay_between_pages: [1.5, 3.0]
  # Seconds between different sites.
  delay_between_sites: [2.0, 5.0]
  # Most pages fetched per site per run, including the homepage.
  max_pages_per_site: 5
  # Per-request timeout, seconds.
  timeout: 20
  # Identify honestly first. Some sites 403 anything that is not a browser, so
  # on a 403 the fetch is retried once with the fallback below. Measured on the
  # real sites: vaquerorestaurant.com refuses the bot UA, macspizzapub.com
  # refuses the browser UA - neither alone is enough.
  user_agent: "bardeals/0.1 (personal deal tracker)"
  fallback_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
  # Skip a page whose extracted text is longer than this many characters after
  # cleaning; a page this big is a menu dump, not a specials page.
  max_page_chars: 20000
  # Text sent to the LLM is capped at this many characters (logged when it hits).
  max_llm_chars: 8000
  # Follow PDF links too: a lot of bars publish their menu and happy-hour
  # sheet as a PDF rather than as a page.
  follow_pdfs: true
  # Most PDF pages to read text from.
  max_pdf_pages: 8
  # A link whose URL or anchor text contains one of these is worth following
  # from the homepage. Ordered by how promising they are.
  follow_keywords:
    - happy-hour
    - happyhour
    - happy hour
    - special
    - deal
    - drink
    - menu
    - events
    - calendar
  # Never follow links containing these.
  skip_keywords:
    - facebook.com
    - instagram.com
    - twitter.com
    - x.com
    - tiktok.com
    - yelp.com
    - doordash
    - ubereats
    - grubhub
    - opentable
    - toasttab
    - /cart
    - /checkout
    - /account
    - /login
    - "mailto:"
    - "tel:"
    - .jpg
    - .png
    - .zip

